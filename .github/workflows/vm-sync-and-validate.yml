name: vm-sync-and-validate

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      vm_name:
        description: Compute Engine instance name
        required: false
        default: quinn-amc-vps
      vm_zone:
        description: Compute Engine zone
        required: false
        default: europe-west6-c
      repo_dir:
        description: Target checkout path on the VM
        required: false
        default: /home/leven/quinn-amc-ci
      install_tooling:
        description: Install or repair required VM tooling before validation
        required: false
        default: true
        type: boolean
      run_suite:
        description: Run the validated VPS baseline suite after sync
        required: false
        default: true
        type: boolean
      suite_config:
        description: Harness config for the VPS suite step
        required: false
        default: configs/harness/vps_baseline_vod_live.json

permissions:
  contents: read
  id-token: write

env:
  DEFAULT_GCP_PROJECT_ID: project-475ee630-5b59-420e-8b7
  DEFAULT_GCP_VM_NAME: quinn-amc-vps
  DEFAULT_GCP_VM_ZONE: europe-west6-c
  DEFAULT_GCP_REPO_DIR: /home/leven/quinn-amc-ci
  DEFAULT_SUITE_CONFIG: configs/harness/vps_baseline_vod_live.json

jobs:
  sync-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - name: Set up gcloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          version: '>= 363.0.0'

      - name: Resolve workflow settings
        env:
          VM_NAME_INPUT: ${{ github.event.inputs.vm_name }}
          VM_ZONE_INPUT: ${{ github.event.inputs.vm_zone }}
          REPO_DIR_INPUT: ${{ github.event.inputs.repo_dir }}
          INSTALL_TOOLING_INPUT: ${{ github.event.inputs.install_tooling }}
          RUN_SUITE_INPUT: ${{ github.event.inputs.run_suite }}
          SUITE_CONFIG_INPUT: ${{ github.event.inputs.suite_config }}
        run: |
          set -euo pipefail

          vm_name="${VM_NAME_INPUT:-$DEFAULT_GCP_VM_NAME}"
          vm_zone="${VM_ZONE_INPUT:-$DEFAULT_GCP_VM_ZONE}"
          repo_dir="${REPO_DIR_INPUT:-$DEFAULT_GCP_REPO_DIR}"
          install_tooling="${INSTALL_TOOLING_INPUT:-true}"
          run_suite="${RUN_SUITE_INPUT:-true}"
          suite_config="${SUITE_CONFIG_INPUT:-$DEFAULT_SUITE_CONFIG}"

          {
            echo "GCP_PROJECT_ID=$DEFAULT_GCP_PROJECT_ID"
            echo "GCP_VM_NAME=$vm_name"
            echo "GCP_VM_ZONE=$vm_zone"
            echo "GCP_REPO_DIR=$repo_dir"
            echo "INSTALL_TOOLING=$install_tooling"
            echo "RUN_SUITE=$run_suite"
            echo "SUITE_CONFIG=$suite_config"
          } >> "$GITHUB_ENV"

      - name: Verify Compute Engine access
        run: |
          set -euo pipefail
          gcloud compute instances describe "$GCP_VM_NAME" \
            --project "$GCP_PROJECT_ID" \
            --zone "$GCP_VM_ZONE" \
            --format='value(name,status)'

      - name: Create VM sync archive
        run: |
          set -euo pipefail
          tar \
            --exclude='./target' \
            --exclude='./results' \
            --exclude='./.codebase-memory' \
            -czf /tmp/quinn-amc-vm-sync.tgz .

      - name: Copy VM sync archive to the instance
        run: |
          set -euo pipefail
          gcloud compute scp /tmp/quinn-amc-vm-sync.tgz "$GCP_VM_NAME:/tmp/quinn-amc-vm-sync.tgz" \
            --project "$GCP_PROJECT_ID" \
            --zone "$GCP_VM_ZONE"

      - name: Sync clean checkout to target SHA on the VM
        env:
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          gcloud compute ssh "$GCP_VM_NAME" \
            --project "$GCP_PROJECT_ID" \
            --zone "$GCP_VM_ZONE" \
            --command "bash -lc '
              set -euo pipefail
              repo_dir=\"$GCP_REPO_DIR\"
              target_sha=\"$TARGET_SHA\"

              rm -rf \"$repo_dir\"
              mkdir -p \"$repo_dir\"
              tar -xzf /tmp/quinn-amc-vm-sync.tgz -C \"$repo_dir\"
              cd \"$repo_dir\"
              git checkout --force \"$target_sha\"

              actual_sha=\"$(git rev-parse HEAD)\"
              if [[ \"$actual_sha\" != \"$target_sha\" ]]; then
                echo \"expected $target_sha but found $actual_sha\" >&2
                exit 1
              fi

              test -f data/processed/manifests/sintel_trailer_replay.json
              echo \"vm checkout synced at $actual_sha\"
            '"

      - name: Install VM tooling
        run: |
          set -euo pipefail
          if [[ "$INSTALL_TOOLING" != "true" ]]; then
            echo "Skipping VM tooling installation"
            exit 0
          fi

          gcloud compute ssh "$GCP_VM_NAME" \
            --project "$GCP_PROJECT_ID" \
            --zone "$GCP_VM_ZONE" \
            --command "bash -lc '
              set -euo pipefail
              cd \"$GCP_REPO_DIR\"
              bash scripts/experiments/bootstrap_linux_vps.sh
            '"

      - name: Verify VM tooling and checkout state
        env:
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          gcloud compute ssh "$GCP_VM_NAME" \
            --project "$GCP_PROJECT_ID" \
            --zone "$GCP_VM_ZONE" \
            --command "bash -lc '
              set -euo pipefail
              cd \"$GCP_REPO_DIR\"
              actual_sha=\"$(git rev-parse HEAD)\"
              [[ \"$actual_sha\" == \"$TARGET_SHA\" ]]
              command -v git jq docker tc ip nsenter curl
              bash -lc \"command -v cargo rustc\"
              docker compose version
              sudo -n true
              sudo tc qdisc show dev lo >/dev/null
            '"

      - name: Run VPS baseline suite
        run: |
          set -euo pipefail
          if [[ "$RUN_SUITE" != "true" ]]; then
            echo "Skipping VPS suite execution"
            exit 0
          fi

          gcloud compute ssh "$GCP_VM_NAME" \
            --project "$GCP_PROJECT_ID" \
            --zone "$GCP_VM_ZONE" \
            --command "bash -lc '
              set -euo pipefail
              cd \"$GCP_REPO_DIR\"
              sudo bash scripts/experiments/run_linux_vps_suite.sh \"$SUITE_CONFIG\"
            '"

      - name: Inspect artifacts and permissions
        run: |
          set -euo pipefail
          if [[ "$RUN_SUITE" != "true" ]]; then
            echo "Skipping artifact inspection because VPS suite execution was disabled"
            exit 0
          fi

          gcloud compute ssh "$GCP_VM_NAME" \
            --project "$GCP_PROJECT_ID" \
            --zone "$GCP_VM_ZONE" \
            --command "bash -lc '
              set -euo pipefail
              cd \"$GCP_REPO_DIR\"
              stat -c \"%U:%G %a %n\" results results/raw results/raw/harness results/processed results/processed/harness
              find results/raw/harness -maxdepth 1 -type f | sort
              find results/processed/harness -maxdepth 1 -type f | sort
            '"